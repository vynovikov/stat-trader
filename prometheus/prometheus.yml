global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  # сам Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # stock-interactor (Go)
  - job_name: 'stock-interactor'
    metrics_path: /metrics
    static_configs:
      - targets: ['stock-interactor:9090']

  # trade-engine (Python)
  - job_name: 'trade-engine'
    metrics_path: /metrics
    static_configs:
      - targets: ['trade-engine:5500']
